[package]
name = "bridge-node"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "bridge"
path = "src/main.rs"

# подставной Claude для тестов агента (в publish не попадает)
[[bin]]
name = "fake-claude"
path = "tests/fixtures/fake_claude.rs"
test = false
doc = false

[dependencies]
bridge-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
parking_lot.workspace = true
tokio.workspace = true
axum.workspace = true
reqwest.workspace = true
futures-util.workspace = true
notify.workspace = true
tokio-util.workspace = true
bytes.workspace = true
uuid.workspace = true
indexmap.workspace = true
hex.workspace = true
sha2.workspace = true
rand.workspace = true
if-addrs = "0.13"
tower = { version = "0.5", default-features = false, features = ["util"] }
sha1 = "0.10"
md-5 = "0.10"
crc32fast = "1"
hmac.workspace = true
base64.workspace = true
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# управление ПК по разрешению (SendInput) — только в Windows
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
# Проверить код Windows на любой ОС: cargo check -p bridge-node --features check-win
check-win = []
