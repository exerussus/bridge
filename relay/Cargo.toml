[package]
name = "most-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Свой сервер-ретранслятор для Моста: TURN (UDP/TCP) и временные ключи участникам"

[[bin]]
name = "most-relay"
path = "src/main.rs"

[dependencies]
bridge-core = { path = "../core" }
bridge-turn = { path = "../turn" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
parking_lot.workspace = true
tokio.workspace = true
tokio-util.workspace = true
axum.workspace = true
hex.workspace = true
rand.workspace = true
if-addrs = "0.13"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
base64.workspace = true
hmac.workspace = true
sha2.workspace = true
futures-util.workspace = true
x25519-dalek = "2"
hkdf = "0.12"
chacha20poly1305 = "0.10"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
